[package]
name = "decmed_crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
jni = "0.21"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
umbral-pre = { version = "0.11", features = ["default-serialization", "serde"] }
